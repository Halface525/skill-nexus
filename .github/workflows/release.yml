# ════════════════════════════════════════════════════
# SkillNexus 自动发布工作流
# 触发方式:推送 v* 开头的 tag(如 git tag v0.2.0 && git push --tags)
# 效果:三平台自动构建 → 自动创建/更新 GitHub Release 并上传安装包
# ════════════════════════════════════════════════════
name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

# 需要写权限来创建 Release 并上传安装包(默认 GITHUB_TOKEN 是只读的)
permissions:
  contents: write

jobs:
  # 先建 Release 占位,拿到 release id,避免多平台竞态
  create-release:
    runs-on: ubuntu-latest
    outputs:
      release_id: ${{ steps.create-release.outputs.id }}
    steps:
      - uses: actions/checkout@v4
      - name: Create GitHub Release
        id: create-release
        uses: taiki-e/create-gh-release-action@v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          title: ${{ github.ref_name }}

  # 三平台并行构建,并把安装包上传到同一个 Release
  build:
    needs: create-release
    strategy:
      matrix:
        include:
          - platform: windows-latest
            args: --target x86_64-pc-windows-msvc
            targets: x86_64-pc-windows-msvc
          - platform: macos-latest
            args: --target aarch64-apple-darwin
            targets: aarch64-apple-darwin
          - platform: macos-latest
            args: --target x86_64-apple-darwin
            targets: x86_64-apple-darwin
          - platform: ubuntu-latest
            args: --target x86_64-unknown-linux-gnu
            targets: x86_64-unknown-linux-gnu
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
      # 显式安装目标:macos-latest 是 arm64,编译 x86_64 需要先 rustup target add
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.targets }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install frontend dependencies
        run: npm install

      - name: Build and upload release asset
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: ${{ github.ref_name }}
          releaseId: ${{ needs.create-release.outputs.release_id }}
          args: ${{ matrix.args }}

      # 额外上传 Windows 绿色免安装版(exe 本体,不依赖安装器)
      - name: Upload portable Windows exe
        if: matrix.platform == 'windows-latest'
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ASSET=""
          for p in "src-tauri/target/x86_64-pc-windows-msvc/release/SkillNexus.exe" "src-tauri/target/release/SkillNexus.exe"; do
            [ -f "$p" ] && ASSET="$p" && break
          done
          if [ -z "$ASSET" ]; then echo "portable exe not found"; exit 1; fi
          curl -sL -H "Authorization: token $GITHUB_TOKEN" \
            -H "Content-Type: application/octet-stream" \
            --data-binary "@$ASSET" \
            "https://uploads.github.com/repos/${{ github.repository }}/releases/${{ needs.create-release.outputs.release_id }}/assets?name=SkillNexus.exe"
          echo "uploaded $ASSET as SkillNexus.exe"
